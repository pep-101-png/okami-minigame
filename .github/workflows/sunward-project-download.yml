name: Package Sunward project download

on:
  push:
    branches:
      - fix/windflower-player-review-2
    paths:
      - .github/workflows/sunward-project-download.yml
      - tools/project-download/**

permissions:
  contents: write

concurrency:
  group: sunward-player-fixes-2
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Retrieve project and full Git LFS assets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true
          persist-credentials: false
      - name: Verify complete project, package and check ZIP contents
        run: python3 tools/project-download/package.py
      - name: Publish standalone project download
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          tag=sunward-player-fixes-2-2026-10-23
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" download-output/*.zip download-output/*.sha256 --clobber
          else
            gh release create "$tag" download-output/*.zip download-output/*.sha256 \
              --target "$SOURCE_COMMIT" --prerelease --latest=false \
              --title "Sunward Player Fixes 2 - complete Unity project" \
              --notes-file tools/project-download/CHANGES-AND-CHECKS.md
          fi
