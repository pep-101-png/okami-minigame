name: Deploy wolf viewer

on:
  push:
    branches: [wolf-viewer-pages]
    paths:
      - 'wolf-viewer/**'
      - '.github/workflows/wolf-viewer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wolf-viewer-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: wolf-viewer/package-lock.json
      - name: Install viewer dependencies
        run: npm ci --prefix wolf-viewer
      - name: Build existing viewer
        run: npm run build --prefix wolf-viewer
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: wolf-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy standalone viewer
        id: deployment
        uses: actions/deploy-pages@v4
