<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="./favicon.svg"><title>Wolf viewer · motion comparison</title><style>body{margin:0;background:#eee5ce;color:#423b30;font:16px Georgia}header{padding:14px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}a{color:#843b2e}button,select{padding:8px;background:#faf3e3;border:1px solid #9b8966}input{width:200px}section{display:grid;grid-template-columns:1fr 1fr}iframe{width:100%;height:calc(100vh - 130px);border:0}h2{font-size:16px;font-weight:normal;margin:0;padding:8px 22px}@media(max-width:700px){section{grid-template-columns:1fr}iframe{height:45vh}}</style></head><body><header><strong>Wolf viewer · Tail & run 02</strong><a href="./">Open viewer</a><select id="clip"><option>Run</option><option>Walk</option><option>Idle</option></select><button id="play">Play together</button><label>Frame <input id="phase" type="range" min="0" max="1" step=".001" value=".75"></label><select id="view"><option value="side">Side</option><option value="rear">Rear ¾</option><option value="tail">Tail close-up</option></select><select id="material"><option value="painted">Painted</option><option value="neutral">Neutral geometry</option></select></header><section><div><h2>Previous build</h2><iframe id="before" title="Previous wolf"></iframe></div><div><h2>Current · passive tail and coordinated upper body</h2><iframe id="after" title="Current wolf"></iframe></div></section><script type="module">
const jawStudy=new URLSearchParams(location.search).get('study')==='jaw';
const headStudy=jawStudy||new URLSearchParams(location.search).get('study')==='head';
const neckReview=new URLSearchParams(location.search).get('review')==='neck';if(neckReview&&!headStudy){document.querySelector('#before').src='./?compare=1&capture=1&review=baseline';document.querySelector('#after').src='./?compare=1&capture=1&review=candidate';const labels=document.querySelectorAll('h2');labels[0].textContent='Accepted baseline · 2ba1f2b';labels[1].textContent='Neck repair · approved checkpoint';for(const [value,label] of [['neckSide','Neck side'],['neckFront','Neck front'],['neckRear','Neck rear']]){const option=document.createElement('option');option.value=value;option.textContent=label;document.querySelector('#view').append(option)}document.querySelector('#view').value='neckSide';}
if(jawStudy)document.querySelector('header a').href='./?version=jaw-repair';
if(headStudy){document.querySelector('#before').src='./?compare=1&capture=1&version='+(jawStudy?'head-study':'neck-approved');document.querySelector('#after').src='./?compare=1&capture=1&version='+(jawStudy?'jaw-repair':'head-study');const labels=document.querySelectorAll('h2');labels[0].textContent=jawStudy?'Before · previous head study (not approved)':'Before · approved neck checkpoint';labels[1].textContent=jawStudy?'After · jaw & face repair (awaiting review)':'After · head reconstruction (review)';document.querySelector('header strong').textContent=jawStudy?'Wolf viewer · jaw & face repair':'Wolf viewer · head anatomy';document.querySelector('#clip').value='Idle';document.querySelector('#phase').value='.2';for(const [value,label] of [['headProfile','Head profile'],['headFront','Head front'],['headLeft','Head ¾ left'],['headRight','Head ¾ right'],['headJaw','Mouth & lower jaw']]){const option=document.createElement('option');option.value=value;option.textContent=label;document.querySelector('#view').append(option)}document.querySelector('#view').value='headProfile';}
if(!headStudy&&!neckReview){document.querySelector('#before').src='./?compare=1&baseline=1';document.querySelector('#after').src='./?compare=1';}
const frames=[document.querySelector('#before'),document.querySelector('#after')],slider=document.querySelector('#phase'),play=document.querySelector('#play'),view=document.querySelector('#view'),clip=document.querySelector('#clip');let playing=false,last=0,phase=headStudy?.2:.75,ready=false;function studios(){return frames.map(f=>f.contentWindow.wolfStudio)}function camera(){
 const headViews={headProfile:[1.6,1.58,-1.20],headFront:[0,1.66,-3.10],headLeft:[1.10,1.66,-2.55],headRight:[-1.10,1.66,-2.55],headJaw:[1.12,1.43,-2.10]};
 const head=headViews[view.value];const offset=({Idle:[0,0],Walk:[-.13,-.14],Run:[-.33,-.23]}[clip.value]||[0,0]);
 for(const s of studios()){s.controls.enableDamping=false;
  if(head){s.camera.position.set(head[0],head[1]+offset[0],head[2]+offset[1]);s.controls.target.set(0,(view.value==='headJaw'?1.43:1.58)+offset[0],(view.value==='headJaw'?-1.29:-1.20)+offset[1]);}
  else{s.camera.position.set(...({side:[-5.7,2,.1],rear:[-3,2.05,4],tail:[-2.5,1.6,2.2],neckSide:[2.4,1.34,-1.1],neckFront:[.8,1.35,-2.7],neckRear:[1.8,1.9,.8]}[view.value]));s.controls.target.set(...(view.value.startsWith('neck')?[0,1.23,-.9]:view.value==='tail'?[0,.7,1]:[0,.9,-.05]));}
  s.controls.update();s.renderer.render(s.scene,s.camera);
 }
}
const originalMaterials=new WeakMap();
function materialView(){for(const s of studios())if(s?.ready){s.model.traverse(o=>{if(!o.isMesh)return;if(o.material.isMeshBasicMaterial){o.visible=document.querySelector('#material').value==='painted';return}if(!originalMaterials.has(o)){const painted=o.material,neutral=painted.clone();neutral.map=null;neutral.normalMap=null;neutral.roughness=1;neutral.metalness=0;neutral.side=0;neutral.color.set('#b9b9b9');originalMaterials.set(o,{painted,neutral});}o.material=originalMaterials.get(o)[document.querySelector('#material').value];});s.renderer.render(s.scene,s.camera)}}
document.querySelector('#material').onchange=materialView;
function sample(){if(!ready)return;for(const s of studios()){s.externalClock=true;s.sample(clip.value,phase)}camera()}slider.oninput=()=>{playing=false;play.textContent='Play together';phase=Number(slider.value);sample()};view.onchange=camera;clip.onchange=()=>{playing=false;play.textContent='Play together';phase=0;slider.value=0;sample()};play.onclick=()=>{playing=!playing;if(playing)for(const s of studios())s.play();play.textContent=playing?'Pause together':'Play together'};function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(playing&&ready){for(const s of studios())s.advance(dt);phase=(phase+dt/(studios()[1].action.getClip().duration))%1;slider.value=phase}requestAnimationFrame(tick)}requestAnimationFrame(tick);const pending=setInterval(()=>{if(studios().every(s=>s?.ready)){clearInterval(pending);const selected=clip.value;clip.replaceChildren(...studios()[1].clips.map(c=>{const o=document.createElement('option');o.value=c.name;o.textContent=c.name;return o}));clip.value=selected;ready=true;sample()}},100);
window.wolfComparison={get ready(){return ready},studios};
</script></body></html>
