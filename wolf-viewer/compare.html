<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="./favicon.svg"><title>Wolf viewer · motion comparison</title><style>body{margin:0;background:#eee5ce;color:#423b30;font:16px Georgia}header{padding:14px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}a{color:#843b2e}button,select{padding:8px;background:#faf3e3;border:1px solid #9b8966}input{width:200px}section{display:grid;grid-template-columns:1fr 1fr}iframe{width:100%;height:calc(100vh - 130px);border:0}h2{font-size:16px;font-weight:normal;margin:0;padding:8px 22px}@media(max-width:700px){section{grid-template-columns:1fr}iframe{height:45vh}}</style></head><body><header><strong>Wolf viewer · Tail & run 02</strong><a href="./">Open viewer</a><select id="clip"><option>Run</option><option>Walk</option><option>Idle</option></select><button id="play">Play together</button><label>Frame <input id="phase" type="range" min="0" max="1" step=".001" value=".75"></label><select id="view"><option value="side">Side</option><option value="rear">Rear ¾</option><option value="tail">Tail close-up</option></select></header><section><div><h2>Previous build</h2><iframe id="before" title="Previous wolf" src="./?compare=1&amp;baseline=1"></iframe></div><div><h2>Current · passive tail and coordinated upper body</h2><iframe id="after" title="Current wolf" src="./?compare=1"></iframe></div></section><script type="module">
const frames=[document.querySelector('#before'),document.querySelector('#after')],slider=document.querySelector('#phase'),play=document.querySelector('#play'),view=document.querySelector('#view'),clip=document.querySelector('#clip');let playing=false,last=0,phase=.75,ready=false;function studios(){return frames.map(f=>f.contentWindow.wolfStudio)}function camera(){for(const s of studios()){s.controls.enableDamping=false;s.camera.position.set(...({side:[-5.7,2,.1],rear:[-3,2.05,4],tail:[-2.5,1.6,2.2]}[view.value]));s.controls.target.set(...(view.value==='tail'?[0,.7,1]:[0,.9,-.05]));s.controls.update();s.renderer.render(s.scene,s.camera)}}function sample(){if(!ready)return;for(const s of studios()){s.externalClock=true;s.sample(clip.value,phase)}camera()}slider.oninput=()=>{playing=false;play.textContent='Play together';phase=Number(slider.value);sample()};view.onchange=camera;clip.onchange=()=>{playing=false;play.textContent='Play together';phase=0;slider.value=0;sample()};play.onclick=()=>{playing=!playing;if(playing)for(const s of studios())s.play();play.textContent=playing?'Pause together':'Play together'};function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(playing&&ready){for(const s of studios())s.advance(dt);phase=(phase+dt/(studios()[1].action.getClip().duration))%1;slider.value=phase}requestAnimationFrame(tick)}requestAnimationFrame(tick);const pending=setInterval(()=>{if(studios().every(s=>s?.ready)){clearInterval(pending);ready=true;sample()}},100);
</script></body></html>
