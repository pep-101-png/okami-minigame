<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>Run repair · before and after</title><style>body{margin:0;background:#eee5ce;color:#423b30;font:16px Georgia}header{padding:14px 22px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}header a{color:#843b2e}button,select{padding:8px;background:#faf3e3;border:1px solid #9b8966}input{width:260px}section{display:grid;grid-template-columns:1fr 1fr}iframe{width:100%;height:calc(100vh - 120px);border:0}h2{font-size:16px;font-weight:normal;margin:0;padding:10px 22px}p{margin:0}@media(max-width:700px){section{grid-template-columns:1fr}iframe{height:45vh}}</style></head><body><header><strong>Run repair · R1</strong><a href="/">Open viewer</a><button id="play">Play together</button><label>Stride <input id="phase" type="range" min="0" max="1" step=".001" value=".75"></label><select id="view"><option value="side">Side</option><option value="rear">Rear ¾</option></select></header><section><div><h2>Previous build</h2><iframe id="before" title="Previous wolf run" src="/?compare=1&amp;baseline=1"></iframe></div><div><h2>Corrected run · plate removed, revised recovery, corrected hip surface</h2><iframe id="after" title="Corrected wolf run" src="/?compare=1"></iframe></div></section><script type="module">
const frames=[document.querySelector('#before'),document.querySelector('#after')],slider=document.querySelector('#phase'),play=document.querySelector('#play'),view=document.querySelector('#view');let playing=false,last=0,phase=.75;function sample(){for(const f of frames){const s=f.contentWindow.wolfStudio;if(!s?.ready)return; s.sample('Run',phase);s.controls.enableDamping=false;s.camera.position.set(...(view.value==='rear'?[-3,2.05,4]:[-5.7,2,.1]));s.controls.target.set(0,.9,-.05);s.controls.update();s.renderer.render(s.scene,s.camera);}}slider.oninput=()=>{playing=false;play.textContent='Play together';phase=Number(slider.value);sample()};view.onchange=sample;play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause together':'Play together'};function tick(t){const dt=Math.min(.05,(t-last)/1000);last=t;if(playing){phase=(phase+dt)%1;slider.value=phase;sample()}requestAnimationFrame(tick)}requestAnimationFrame(tick);let pending=setInterval(()=>{if(frames.every(f=>f.contentWindow.wolfStudio?.ready)){clearInterval(pending);sample()}},100);
</script></body></html>
